[package]
name = "rtsp-camera-viewer"
version = "2.1.1"
edition = "2021"
authors = ["Pulkit Mundra <pulkitmundra@github.com>"]
description = "NVR Command Center - Ultra-low-latency GPU multi-camera RTSP & Cloud P2P surveillance wall in Native Rust"
license = "MIT"
repository = "https://github.com/pulkitmundra/nvr-command-center"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
aes = "0.8"
base64 = "0.21"
cipher = "0.4"
hmac = "0.12"
md-5 = "0.10"
ofb = "0.6"
pbkdf2 = "0.12"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
xml-rs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
