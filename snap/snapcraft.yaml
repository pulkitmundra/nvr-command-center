name: nvr-command-center
title: NVR Command Center (RTSP & CCTV Viewer)
adopt-info: nvr-command-center
license: MIT
website: https://pulkit-mundra-portfolio.vercel.app/projects/nvr-command-center
source-code: https://github.com/pulkitmundra/nvr-command-center
issues: https://github.com/pulkitmundra/nvr-command-center/issues
contact: https://github.com/pulkitmundra/nvr-command-center/issues
donation:
  - https://buymeacoffee.com/pulkitmundra
  - https://github.com/sponsors/pulkitmundra
summary: GPU RTSP CCTV, NVR Live Wall, AI Playback Timeline & Cloud P2P Viewer
description: |
  NVR Command Center v3.0 is an ultra-low-latency, GPU-accelerated multi-camera
  RTSP IP Camera, CCTV, NVR, DVR, and XVR live video wall and interactive
  playback client for Linux and Ubuntu, built in Native Rust (eframe/egui +
  OpenGL) with zero-probe FFmpeg workers and built-in Cloud P2P remote access.

  Stream 1 to 32 live security cameras 24/7 with < 0.9s parallel startup,
  < 80ms glass-to-glass latency, zero stream drift, and ~65-110 MB RAM on both
  local LAN and any remote internet connection.

  Interactive "What Happened" NVR Playback (v3.0):
  * Multi-Scale Magnetic Timeline (24h down to 2m zoom) with semantic AI lanes
    for Human, Vehicle, Intrusion/Alarm, Motion, and 24/7 Continuous recording
  * Smart Skip Dead-Air Engine: 8x Fast-Glide over empty footage (auto-slowing
    to 1x before events) or 1-click Instant Event Jump across LAN and Cloud P2P
  * Smooth Trick-Play (-4x to 16x), single-frame step (,/.) via in-RAM memfd
    ring buffer, floating Live Picture-in-Picture (PiP), 2x2 sync playback, and
    2-click lossless .MP4 clip export (I -> O -> Export MP4)

  Native Linux Alternative for CCTV & NVR Client Apps:
  * Dahua: SmartPSS (Smart PSS), DMSS (gDMSS / iDMSS), Easy4ip (Easy4ipCloud)
  * CP Plus (CPPlus): KVMS Pro (KVMS), gCMOB, iCMOB, InstaOn, EzyKam
  * Hikvision & HiLook: iVMS-4200 (iVMS), Hik-Connect (HikConnect)
  * Amcrest: Amcrest Surveillance Pro, Amcrest View Pro, Amcrest Cloud
  * Reolink, Lorex, IMOU, TP-Link Tapo & VIGI, Uniview (UNV / EZView), EZVIZ,
    Axis, Foscam, UniFi Protect, ONVIF cameras, Frigate, ZoneMinder, Blue Iris.

  Key Live & Security Architecture:
  * Zero-Lag Kernel Pipe Burst Drain (ioctl FIONREAD) keeps 0 buffered frames
  * Built-in Dual-Port Cloud P2P Tunnel (RTSP + HTTP NVR API over Easy4ip/InstaOn
    Serial Number) with zero router port forwarding and automatic LAN fallback
  * Zero-leak loopback AuthGateway (keeps NVR credentials out of ps/proc),
    0600 private storage, and Canary Auth circuit-breaker protection
  * Minimal Obsidian Studio UI, Borderless Zen Wall (B / F11), Smart Area Box
    Zoom (1.0x - 8.0x) with Wayland touchpad pinch & radar minimap, and Patrol

  Search Keywords:
  rtsp, rtsp viewer, rtsp player, cctv, cctv viewer, ip camera, security camera,
  surveillance, video wall, nvr, nvr viewer, nvr playback, dvr, xvr, onvif,
  h265, hevc, h264, dahua, smartpss, dmss, easy4ip, cp plus, kvms pro, gcmob,
  instaon, hikvision, ivms-4200, hik-connect, amcrest, reolink, lorex, imou,
  tapo, uniview, ezviz, cloud p2p, tailscale, mp4 export.

  Architecture Deep Dive & More from the Developer (Pulkit Mundra):
  * Project Case Study & Interactive Architecture Lab: https://pulkit-mundra-portfolio.vercel.app/projects/nvr-command-center
  * Engineering Write-Up (650 MB to 70 MB Port & 64 KB Linux Pipe Trap): https://pulkit-mundra-portfolio.vercel.app/engineering/python-to-rust-12-camera-nvr-linux-pipe-trap
  * Developer Portfolio & More Open-Source Linux Apps: https://pulkit-mundra-portfolio.vercel.app

  Support the Project:
  * Buy Me a Coffee: https://buymeacoffee.com/pulkitmundra
  * GitHub Sponsors: https://github.com/sponsors/pulkitmundra

base: core24
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2404/X11/XErrorDB

apps:
  nvr-command-center:
    command: bin/nvr-command-center
    desktop: snap/gui/nvr-command-center.desktop
    plugs:
      - network
      - network-bind
      - audio-playback
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - gpu-2404
      - home

parts:
  nvr-command-center:
    plugin: rust
    source: .
    rust-Build-Flags:
      - --locked
    build-packages:
      - pkg-config
    stage-packages:
      - ffmpeg
      - libgl1
      - libegl1
      - libglx0
      - libopengl0
      - libgles2
      - libdrm2
      - libgbm1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxrandr2
      - libxi6
      - libxext6
      - libxfixes3
      - libxrender1
      - libxinerama1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - ca-certificates
    override-build: |
      cargo build --release --locked
      install -Dm755 target/release/rtsp-camera-viewer "$CRAFT_PART_INSTALL/bin/rtsp-camera-viewer"
      SNAP_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' "$CRAFT_PART_SRC/Cargo.toml" | head -n 1)"
      craftctl set version="$SNAP_VER"
      mkdir -p "$CRAFT_PART_INSTALL/bin" "$CRAFT_PART_INSTALL/meta/gui" "$CRAFT_PART_INSTALL/gpu-2404"
      cp "$CRAFT_PART_SRC/assets/icon.png" "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      cp "$CRAFT_PART_SRC/snap/gui/nvr-command-center.desktop" "$CRAFT_PART_INSTALL/meta/gui/nvr-command-center.desktop"
      cat << 'EOF' > "$CRAFT_PART_INSTALL/bin/rtsp-viewer-launch"
      #!/bin/sh
      export PATH="$SNAP/usr/bin:$SNAP/bin:$PATH"
      export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/usr/lib/x86_64-linux-gnu/blas:$SNAP/usr/lib/x86_64-linux-gnu/lapack"
      exec "$SNAP/bin/rtsp-camera-viewer" "$@"
      EOF
      chmod 0755 "$CRAFT_PART_INSTALL/bin/rtsp-viewer-launch"
      cat << 'EOF' > "$CRAFT_PART_INSTALL/bin/nvr-command-center"
      #!/bin/sh
      if [ -x "$SNAP/gpu-2404/bin/gpu-2404-provider-wrapper" ]; then
        exec "$SNAP/gpu-2404/bin/gpu-2404-provider-wrapper" "$SNAP/bin/rtsp-viewer-launch" "$@"
      fi
      exec "$SNAP/bin/rtsp-viewer-launch" "$@"
      EOF
      chmod 0755 "$CRAFT_PART_INSTALL/bin/nvr-command-center"
